workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Key
    environment:
      node: 22.11.0
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Set up keychain and import certificate
        script: |
          keychain initialize
          keychain add-certificates --certificate ios/ios_distribution.p12 --certificate-password "123456"
      - name: Install provisioning profile
        script: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ios/Coffee_Match_App_Store.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for App Store / TestFlight
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
